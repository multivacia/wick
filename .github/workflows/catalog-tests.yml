name: Catalog 0.9 tests

on:
  pull_request:
    branches: [main]
    paths:
      - 'catalog/**'
      - 'tests/catalog.test.mjs'
      - index.html
      - '.github/workflows/catalog-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  catalog:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run catalog parser tests
        run: node --test tests/catalog.test.mjs
